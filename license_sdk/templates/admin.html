<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAGBIM Server License v1.0</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #ffffff;
      --border: rgba(15, 23, 42, 0.12);
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #faf7f2 0%, var(--bg) 100%);
    }
    main {
      width: min(1100px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); }
    .grid { display: grid; gap: 16px; }
    .login-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; }
    label { display: grid; gap: 6px; font-size: 0.92rem; }
    input, button, select { font: inherit; }
    input, select { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border); }
    button { border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; font-weight: 700; }
    .primary { background: var(--accent); color: white; }
    .secondary { background: #e5e7eb; color: var(--text); }
    .danger { background: rgba(185, 28, 28, 0.12); color: var(--danger); }
    .status { min-height: 1.2em; color: var(--muted); margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(15, 23, 42, 0.08); vertical-align: top; font-size: 0.92rem; }
    th { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eef2ff; color: #1d4ed8; font-size: 0.78rem; font-weight: 700; }
    .pill.pending { background: #fff7ed; color: var(--warn); }
    .pill.approved { background: #ecfdf5; color: var(--accent); }
    .pill.blocked { background: #fef2f2; color: var(--danger); }
    .meta { color: var(--muted); font-size: 0.88rem; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 0.82rem; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 900px) {
      .login-grid { grid-template-columns: 1fr; }
      table, thead, tbody, tr, td, th { display: block; }
      thead { display: none; }
      td { padding: 8px 0; }
      tr { padding: 12px 0; border-bottom: 1px solid rgba(15, 23, 42, 0.08); }
    }
  </style>
</head>
<body>
  <main class="grid">
    <section class="panel">
      <h1>RAGBIM License SDK</h1>
      <p class="meta">Aprovação e bloqueio de instalações para software cliente.</p>
      <div class="grid login-grid">
        <label>
          <span>Email admin</span>
          <input id="emailField" type="email" placeholder="admin@empresa.com">
        </label>
        <label>
          <span>Senha</span>
          <input id="passwordField" type="password" placeholder="Sua senha de administrador">
        </label>
        <button class="primary" id="loginButton" type="button">Entrar</button>
        <button class="secondary" id="refreshButton" type="button">Atualizar lista</button>
        <button class="secondary" id="logoutButton" type="button">Sair</button>
      </div>
      <p class="status" id="loginStatus"></p>
    </section>

    <section class="panel">
      <h2>Instalações</h2>
      <p class="meta">Ações administrativas para aprovar, bloquear e auditar instalações do cliente.</p>
      <div id="tableHost"></div>
    </section>
    <section class="panel">
      <h2>Clientes cadastrados</h2>
      <p class="meta">Dados cadastrais para conferência e gestão administrativa.</p>
      <div id="usersHost"></div>
    </section>
  </main>
<script>
    const loginStatus = document.getElementById('loginStatus');
    const emailField = document.getElementById('emailField');
    const passwordField = document.getElementById('passwordField');
    const tableHost = document.getElementById('tableHost');
    const usersHost = document.getElementById('usersHost');
    const tokenKey = 'ragbim_sdk_token';
    function getToken() { return localStorage.getItem(tokenKey) || ''; }
    function setStatus(msg) { loginStatus.textContent = msg || ''; }
    function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` }; }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (!headers['Authorization'] && getToken()) headers['Authorization'] = `Bearer ${getToken()}`;
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Erro na operação');
      return data;
    }

    async function login() {
      setStatus('Entrando...');
      try {
        const payload = { email: emailField.value, password: passwordField.value };
        const data = await api('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        localStorage.setItem(tokenKey, data.access_token);
        setStatus('Login realizado com sucesso.');
        await loadInstallations();
        await loadUsers();
      } catch (err) {
        setStatus(err.message || 'Não foi possível entrar. Tente novamente.');
      }
    }

    async function logout() {
      try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
      localStorage.removeItem(tokenKey);
      setStatus('Sessão encerrada.');
      tableHost.innerHTML = '';
      usersHost.innerHTML = '';
    }

    async function loadInstallations() {
      try {
        const data = await api('/api/installations');
        const rows = data.items || [];
        if (!rows.length) {
          tableHost.innerHTML = '<p class="meta">Nenhuma instalação registrada.</p>';
          return;
        }
        tableHost.innerHTML = `
          <table>
            <thead>
              <tr><th>Código</th><th>Máquina</th><th>SO</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody>
              ${rows.map(item => `
                <tr>
                  <td class="mono">${item.installation_code || '-'}</td>
                  <td>${item.machine_name || '-'}</td>
                  <td>${item.os_name || '-'}</td>
                  <td><span class="pill ${item.status || 'pending'}">${item.status || 'pending'}</span></td>
                  <td>
                    <div class="actions">
                      <button class="primary" data-action="approve" data-code="${item.installation_code}">Aprovar</button>
                      <button class="danger" data-action="block" data-code="${item.installation_code}">Bloquear</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        tableHost.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const action = btn.dataset.action;
            const code = btn.dataset.code;
            setStatus(`Atualizando instalação ${code}...`);
            await api(`/api/installations/${encodeURIComponent(code)}/${action}`, {
              method: 'POST',
              body: JSON.stringify({ notes: 'Ação administrativa via SDK' })
            });
            await loadInstallations();
            setStatus(`Instalação ${code} ${action === 'approve' ? 'aprovada' : 'bloqueada'}.`);
          });
        });
      } catch (err) {
        setStatus(err.message);
      }
    }

    async function loadUsers() {
      try {
        const data = await api('/api/users');
        const rows = data.items || [];
        usersHost.innerHTML = rows.length ? `
          <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Contato</th><th>Documento</th><th>Endereço</th><th>Status</th></tr></thead>
            <tbody>${rows.map(item => `
              <tr>
                <td>${item.name || '-'}</td><td>${item.email || '-'}</td><td>${item.cellphone || '-'}</td>
                <td>${item.document_type || '-'}<div class="meta">${item.document_number || '-'}</div></td>
                <td>${item.address || '-'}<div class="meta">${item.state || '-'} / ${item.country || '-'}</div></td>
                <td><span class="pill ${item.status || 'pending'}">${item.status || '-'}</span></td>
              </tr>`).join('')}</tbody>
          </table>` : '<p class="meta">Nenhum cliente cadastrado.</p>';
      } catch (err) {
        usersHost.innerHTML = `<p class="meta">${err.message}</p>`;
      }
    }

    document.getElementById('loginButton').addEventListener('click', login);
    document.getElementById('refreshButton').addEventListener('click', loadInstallations);
    document.getElementById('logoutButton').addEventListener('click', logout);

    if (getToken()) {
      loadInstallations();
      loadUsers();
    }
</script>
</body>
</html>
